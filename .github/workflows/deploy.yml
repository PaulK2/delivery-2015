# DISABLED: the backend now runs as a Cloudflare Worker deployed alongside this app
# (worker/, see wrangler.jsonc) — the frontend calls it same-origin at /api. GitHub
# Pages is static-only and cannot run that Worker, so a GitHub Pages build would load
# but every API call (including login) would fail. Production deploys go through
# `npm run deploy` (Cloudflare) instead. Left here for reference / manual runs only.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs of the same group.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        env:
          # Optional: set repo variable VITE_API_URL to bake in the Apps Script URL.
          # Not required — admins can also set it in-app (stored in localStorage).
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
